[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-mcp-toolbox"
version = "1.0.0"
description = "A local MCP server exposing safe calculator, notes search, and system information tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
